  <rect x="80" y="352" width="140" height="15" rx="7" fill="#f59e0b" opacity="0.2"/>
  <text x="150" y="363" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="10" fill="#f59e0b" text-anchor="middle" letter-spacing="1">AUTHENTIC RETRO CLASSIC</text>
