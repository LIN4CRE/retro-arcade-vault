  </defs>
  <rect width="300" height="400" rx="16" fill="#0b0e17"/>
  <rect x="8" y="8" width="284" height="384" rx="12" fill="url(#bg)" stroke="#f59e0b" stroke-width="2"/>
  <!-- Console Header Banner -->
