    <text x="0" y="0" fill="#64748b" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">
      PURE VANILLA HTML5 / CSS3 / JAVASCRIPT  Â·  LOCALSTORAGE SYNC  Â·  STANDALONE &amp; PORTABLE
