      <rect x="0" y="0" width="165" height="42" rx="8" fill="#181f33" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#67e8f9">ðŸ“œ NDS (15 Games)</text>
