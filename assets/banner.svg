    RETRO ARCADE VAULT
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="17" letter-spacing="3" fill="#cbd5e1">
