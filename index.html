<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Arcade Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0d0f18;
      --bg-surface: #151928;
      --bg-card: #1c2237;
      --bg-card-hover: #262e4a;
      --accent-neon: #00ffcc;
      --accent-pink: #ff2a85;
      --accent-purple: #8b5cf6;
      --accent-yellow: #ffd000;
      --text-main: #f0f4fc;
      --text-muted: #8b9bb4;
      --border-color: #2b3553;
      --glow-neon: 0 0 15px rgba(0, 255, 204, 0.4);
      --glow-pink: 0 0 15px rgba(255, 42, 133, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 255, 204, 0.08) 0%, transparent 40%);
    }

    /* Top Navigation */
    header {
      background: rgba(21, 25, 40, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border-color);
      padding: 0.85rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 1.8rem;
      filter: drop-shadow(0 0 8px var(--accent-neon));
    }

    .brand-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 1rem;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--accent-neon), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-pink), #e00067);
      color: #fff;
      box-shadow: var(--glow-pink);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 22px rgba(255, 42, 133, 0.7);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      border-color: var(--accent-neon);
      color: var(--accent-neon);
      background: rgba(0, 255, 204, 0.08);
    }

    /* Main Layout */
    .app-container {
      display: grid;
      grid-template-columns: 380px 1fr;
      flex: 1;
      min-height: calc(100vh - 72px);
    }

    @media (max-width: 1040px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Sidebar / Game Library */
    aside.sidebar {
      background: var(--bg-surface);
      border-right: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 72px);
      position: sticky;
      top: 72px;
    }

    @media (max-width: 1040px) {
      aside.sidebar {
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 2px solid var(--border-color);
      }
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      padding: 8px 12px 8px 34px;
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-neon);
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .filter-tags {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .tag-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tag-btn.active, .tag-btn:hover {
      background: rgba(0, 255, 204, 0.15);
      border-color: var(--accent-neon);
      color: var(--accent-neon);
    }

    .game-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .game-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .game-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 255, 204, 0.3);
      transform: translateX(4px);
    }

    .game-item.active {
      background: rgba(0, 255, 204, 0.12);
      border-color: var(--accent-neon);
      box-shadow: inset 3px 0 0 var(--accent-neon);
    }

    /* Artwork box art thumbnail */
    .game-thumb-wrap {
      width: 48px;
      height: 58px;
      border-radius: 6px;
      overflow: hidden;
      background: #111420;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .game-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }

    .game-item:hover .game-thumb {
      transform: scale(1.08);
    }

    .game-thumb-placeholder {
      font-size: 1.5rem;
    }

    .game-meta {
      flex: 1;
      min-width: 0;
    }

    .game-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-item.active .game-title {
      color: var(--accent-neon);
    }

    .game-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .game-platform {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      color: #9eb5d8;
    }

    .game-item.active .game-platform {
      background: rgba(0, 255, 204, 0.15);
      color: var(--accent-neon);
    }

    .game-delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      font-size: 1.1rem;
      border-radius: 4px;
      opacity: 0;
      transition: all 0.2s;
    }

    .game-item:hover .game-delete-btn {
      opacity: 1;
    }

    .game-delete-btn:hover {
      color: var(--accent-pink);
      background: rgba(255, 42, 133, 0.15);
    }

    /* Main Game Theater View */
    main.stage {
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .stage-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 10px;
    }

    .stage-title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stage-cover-preview {
      width: 44px;
      height: 52px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
    }

    .stage-game-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
    }

    .stage-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-neon);
      background: rgba(0, 255, 204, 0.12);
      border: 1px solid var(--accent-neon);
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .stage-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Screen Frame */
    .screen-container {
      position: relative;
      background: #000;
      border: 3px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 740px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CRT scanline effect */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      z-index: 5;
      display: none;
    }

    .crt-active .crt-overlay {
      display: block;
    }

    .crt-glow {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 50px rgba(0, 255, 204, 0.15);
      pointer-events: none;
      z-index: 6;
      display: none;
    }

    .crt-active .crt-glow {
      display: block;
    }

    .game-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* Bottom Info & Quick Instructions */
    .screen-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 4px 8px;
    }

    .footer-help {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .kbd {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.78rem;
      color: var(--text-main);
      font-family: monospace;
    }

    /* Modal / Form */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 13, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      padding: 16px;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--bg-surface);
      border: 2px solid var(--accent-neon);
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.25);
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      overflow: hidden;
      transform: translateY(20px) scale(0.97);
      transition: all 0.25s ease;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem;
      color: var(--accent-neon);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .modal-close:hover {
      color: #fff;
    }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 75vh;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-input, .form-select, .form-textarea {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-textarea {
      resize: vertical;
      min-height: 85px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-neon);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }

    .form-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
  </style>
</head>

    // Web Audio Synthesizer (8-bit Retro SFX)
    let audioCtx = null;
    function playSfx(type) {
      if (!isSfxEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'select') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'star') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587, now);
          osc.frequency.setValueAtTime(880, now + 0.08);
          osc.frequency.setValueAtTime(1174, now + 0.16);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.05);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      } catch (e) {}
    }

    // Gamepad API Detection & Polling
    function setupGamepad() {
      window.addEventListener("gamepadconnected", (e) => {
        const gp = e.gamepad;
        gamepadBadge.classList.add("connected");
        gamepadLabel.textContent = "Gamepad: " + (gp.id.includes("Xbox") ? "Xbox" : (gp.id.includes("PlayStation") || gp.id.includes("Wireless") ? "PlayStation" : "Connected"));
        playSfx('select');
      });

      window.addEventListener("gamepaddisconnected", () => {
        gamepadBadge.classList.remove("connected");
        gamepadLabel.textContent = "Gamepad: Ready";
      });

      // Quick polling loop for navigating game list with controller D-Pad
      let lastDpadTime = 0;
      function pollGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (let i = 0; i < gamepads.length; i++) {
          const gp = gamepads[i];
          if (gp && gp.connected) {
            const now = Date.now();
            if (now - lastDpadTime > 250) {
              // D-pad Up (Button 12) or Axis Up
              if (gp.buttons[12] && gp.buttons[12].pressed || (gp.axes[1] && gp.axes[1] < -0.6)) {
                navigateGames(-1);
                lastDpadTime = now;
              }
              // D-pad Down (Button 13) or Axis Down
              else if (gp.buttons[13] && gp.buttons[13].pressed || (gp.axes[1] && gp.axes[1] > 0.6)) {
                navigateGames(1);
                lastDpadTime = now;
              }
            }
          }
        }
        requestAnimationFrame(pollGamepad);
      }
      requestAnimationFrame(pollGamepad);
    }

    function navigateGames(direction) {
      if (games.length === 0) return;
      const idx = games.findIndex(g => g.id === activeGameId);
      let nextIdx = idx + direction;
      if (nextIdx < 0) nextIdx = games.length - 1;
      if (nextIdx >= games.length) nextIdx = 0;
      selectGame(games[nextIdx].id);
      playSfx('click');
    }

    // Initialize
    function init() {
      loadGames();
      setupEventListeners();
      
      // Select first game by default
      if (games.length > 0) {
        selectGame(games[0].id);
      }
      renderGameList();
    }

    // Load games from localStorage or defaults
    function loadGames() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          games = JSON.parse(stored);
          DEFAULT_GAMES.forEach(defaultGame => {
            if (!games.some(g => g.id === defaultGame.id || g.src === defaultGame.src)) {
              games.push(defaultGame);
            }
          });
          games.forEach(g => {
            const def = DEFAULT_GAMES.find(dg => dg.id === g.id || dg.src === g.src);
            if (def && !g.cover && def.cover) {
              g.cover = def.cover;
            }
          });
          saveGames();
        } else {
          games = [...DEFAULT_GAMES];
          saveGames();
        }

        const storedFavs = localStorage.getItem("retro_arcade_vault_favs");
        if (storedFavs) {
          favorites = new Set(JSON.parse(storedFavs));
        }

        const storedRecent = localStorage.getItem("retro_arcade_vault_recents");
        if (storedRecent) {
          recentGames = JSON.parse(storedRecent);
        }
      } catch (e) {
        console.error("Failed to read from localStorage:", e);
        games = [...DEFAULT_GAMES];
      }
      updateCounts();
    }

    function saveGames() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
      } catch (e) {
        console.error("Failed to save to localStorage:", e);
      }
      updateCounts();
    }

    function saveFavorites() {
      try {
        localStorage.setItem("retro_arcade_vault_favs", JSON.stringify([...favorites]));
      } catch (e) {}
      updateCounts();
    }

    function saveRecents() {
      try {
        localStorage.setItem("retro_arcade_vault_recents", JSON.stringify(recentGames));
      } catch (e) {}
    }

    function updateCounts() {
      totalCountEl.textContent = games.length;
      if (countPS1El) countPS1El.textContent = games.filter(g => g.category === 'PS1').length;
      if (countGBAEl) countGBAEl.textContent = games.filter(g => g.category === 'GBA').length;
      if (countNDSEl) countNDSEl.textContent = games.filter(g => g.category === 'NDS').length;
      if (countSNESEl) countSNESEl.textContent = games.filter(g => g.category === 'SNES').length;
      if (countSEGAEl) countSEGAEl.textContent = games.filter(g => g.category === 'SEGA').length;
      if (countFavsEl) countFavsEl.textContent = favorites.size;
    }

    // Render Sidebar Game List
    function renderGameList() {
      const filtered = games.filter(g => {
        const matchesCategory = selectedCategory === "ALL" || (g.category && g.category.toUpperCase() === selectedCategory.toUpperCase());
        const matchesSearch = g.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              (g.system && g.system.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        gameListEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">Ã°Å¸â€¢Â¹Ã¯Â¸Â</div>
            <div>No games found.</div>
          </div>
        `;
        return;
      }

      gameListEl.innerHTML = filtered.map(game => {
        const isActive = game.id === activeGameId;
        const coverHtml = game.cover ? `
          <img class="game-thumb" src="${escapeHtml(game.cover)}" alt="${escapeHtml(game.title)}" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'game-thumb-placeholder\\'>${game.emoji || 'Ã°Å¸Å½Â®'}</span>'">
        ` : `
          <span class="game-thumb-placeholder">${game.emoji || 'Ã°Å¸Å½Â®'}</span>
        `;

        return `
          <div class="game-item ${isActive ? 'active' : ''}" data-id="${game.id}">
            <div class="game-thumb-wrap">
              ${coverHtml}
            </div>
            <div class="game-meta">
              <div class="game-title" title="${escapeHtml(game.title)}">${escapeHtml(game.title)}</div>
              <div class="game-sub">
                <span class="game-platform">${escapeHtml(game.system || 'Arcade')}</span>
              </div>
            </div>
            ${games.length > 1 ? `
              <button class="game-delete-btn" data-delete-id="${game.id}" title="Remove game">&times;</button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // Select and load a game in the iframe
    function selectGame(id) {
      const game = games.find(g => g.id === id);
      if (!game) return;

      activeGameId = id;
      currentTitleEl.textContent = game.title;
      currentPlatformEl.textContent = game.system || "Arcade";
      
      if (game.cover) {
        currentCoverEl.src = game.cover;
        currentCoverEl.style.display = "block";
        currentEmojiEl.style.display = "none";
      } else {
        currentCoverEl.style.display = "none";
        currentEmojiEl.style.display = "block";
        currentEmojiEl.textContent = game.emoji || "Ã°Å¸Å½Â®";
      }

      // Update iframe source only if different
      if (gameFrameEl.src !== game.src) {
        gameFrameEl.src = game.src;
      }

      renderGameList();
    }

    // Extract URL if the user pasted full <iframe> code
    function extractSrc(input) {
      const trimmed = input.trim();
      const match = trimmed.match(/src=["']([^"']+)["']/i);
      if (match && match[1]) {
        return match[1];
      }
      return trimmed;
    }

    // Event Listeners
    function setupEventListeners() {
      // Setup Gamepad Detection
      setupGamepad();

      // Sidebar click delegation
      gameListEl.addEventListener("click", (e) => {
        const starBtn = e.target.closest("[data-star-id]");
        if (starBtn) {
          e.stopPropagation();
          const idToStar = starBtn.getAttribute("data-star-id");
          toggleStar(idToStar);
          return;
        }

        const deleteBtn = e.target.closest("[data-delete-id]");
        if (deleteBtn) {
          e.stopPropagation();
          const idToDelete = deleteBtn.getAttribute("data-delete-id");
          if (confirm("Are you sure you want to remove this game?")) {
            games = games.filter(g => g.id !== idToDelete);
            favorites.delete(idToDelete);
            saveGames();
            saveFavorites();
            if (activeGameId === idToDelete && games.length > 0) {
              selectGame(games[0].id);
            }
            renderGameList();
          }
          return;
        }

        const item = e.target.closest(".game-item");
        if (item) {
          const id = item.getAttribute("data-id");
          playSfx('select');
          selectGame(id);
        }
      });

      // Stage Star Button toggle
      stageStarBtn.addEventListener("click", () => {
        if (activeGameId) {
          toggleStar(activeGameId);
        }
      });

      function toggleStar(id) {
        if (favorites.has(id)) {
          favorites.delete(id);
          playSfx('click');
        } else {
          favorites.add(id);
          playSfx('star');
        }
        stageStarBtn.classList.toggle("starred", favorites.has(activeGameId));
        saveFavorites();
        renderGameList();
      }

      // Aspect Ratio Cycling Button
      ratioToggleBtn.addEventListener("click", () => {
        playSfx('click');
        const nextIdx = (ratioModes.indexOf(currentRatioMode) + 1) % ratioModes.length;
        currentRatioMode = ratioModes[nextIdx];
        const activeGame = games.find(g => g.id === activeGameId);
        applyAspectRatio(activeGame ? activeGame.category : "OTHER");
      });

      // SFX Audio Toggle Button
      toggleSfxBtn.addEventListener("click", () => {
        isSfxEnabled = !isSfxEnabled;
        sfxStatus.textContent = isSfxEnabled ? "ON" : "OFF";
        sfxStatus.style.color = isSfxEnabled ? "var(--accent-neon)" : "var(--text-muted)";
        if (isSfxEnabled) playSfx('select');
      });

      // Controls Modal Listeners
      openControlsModalBtn.addEventListener("click", () => {
        playSfx('click');
        controlsModal.classList.add("open");
      });
      const closeControlsModal = () => controlsModal.classList.remove("open");
      closeControlsModalBtn.addEventListener("click", closeControlsModal);
      closeControlsModalBtn2.addEventListener("click", closeControlsModal);
      controlsModal.addEventListener("click", (e) => {
        if (e.target === controlsModal) closeControlsModal();
      });

      // Search input
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderGameList();
      });

      // Category filter buttons
      categoryFilters.addEventListener("click", (e) => {
        const btn = e.target.closest(".tag-btn");
        if (!btn) return;
        categoryFilters.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedCategory = btn.getAttribute("data-category");
        renderGameList();
      });

      // Restart Game button
      reloadGameBtn.addEventListener("click", () => {
        const currentSrc = gameFrameEl.src;
        gameFrameEl.src = "";
        setTimeout(() => {
          gameFrameEl.src = currentSrc;
        }, 80);
      });

      // Fullscreen
      fullscreenBtn.addEventListener("click", toggleFullscreen);

      // CRT Scanline Toggle
      toggleCrtBtn.addEventListener("click", () => {
        isCrtEnabled = !isCrtEnabled;
        screenContainer.classList.toggle("crt-active", isCrtEnabled);
        crtStatus.textContent = isCrtEnabled ? "ON" : "OFF";
        crtStatus.style.color = isCrtEnabled ? "var(--accent-neon)" : "var(--text-muted)";
      });

      // Modal Controls
      openAddModalBtn.addEventListener("click", () => {
        addModal.classList.add("open");
        document.getElementById("gameNameInput").focus();
      });

      const closeModal = () => addModal.classList.remove("open");
      closeAddModalBtn.addEventListener("click", closeModal);
      cancelModalBtn.addEventListener("click", closeModal);
      addModal.addEventListener("click", (e) => {
        if (e.target === addModal) closeModal();
      });

      // Add Game Form Submission
      addGameForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const title = document.getElementById("gameNameInput").value.trim();
        const platformSelect = document.getElementById("gamePlatformInput");
        const category = platformSelect.value;
        const system = platformSelect.options[platformSelect.selectedIndex].text;
        const rawEmbed = document.getElementById("gameEmbedInput").value.trim();
        const cover = document.getElementById("gameCoverInput").value.trim();
        const emoji = document.getElementById("gameEmojiInput").value.trim() || "Ã°Å¸Å½Â®";

        const src = extractSrc(rawEmbed);

        if (!src.startsWith("http://") && !src.startsWith("https://")) {
          alert("Please enter a valid URL or <iframe> embed code.");
          return;
        }

        const newGame = {
          id: "game-" + Date.now(),
          title,
          system,
          category,
          src,
          cover,
          emoji
        };

        games.unshift(newGame);
        saveGames();
        selectGame(newGame.id);
        renderGameList();

        addGameForm.reset();
        closeModal();
      });

      // Keyboard Shortcuts
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        if (e.key === "f" || e.key === "F") {
          e.preventDefault();
          toggleFullscreen();
        } else if (e.key === "r" || e.key === "R") {
          e.preventDefault();
          reloadGameBtn.click();
        }
      });
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (screenContainer.requestFullscreen) {
          screenContainer.requestFullscreen();
        } else if (screenContainer.webkitRequestFullscreen) {
          screenContainer.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    // Launch
    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
